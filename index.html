 next(s){if(s.phase!=='end'||s.ended)return;s.pending=null;s.quiz=null;if(s.extra&&!this.p(s).out){s.phase='roll';s.extra=false;this.log(s,'雙骰獎勵：再擲一次！');return;}s.doubleCount=0;s.turns++;do{s.current=(s.current+1)%6;if(s.current===0)s.round++;}while(this.p(s).out);if(s.round>s.settings.rounds){this.finish(s);return;}s.phase='roll';},
 finish(s){s.ended=true;s.phase='finished';s.pending=null;s.quiz=null;this.log(s,'遊戲結束，按總資產結算！');},
 startQuiz(s,bank,purpose){let pool=bank.filter(q=>(s.settings.chapter==='all'||q.chapter===Number(s.settings.chapter))&&q.level<=s.settings.level);if(!pool.length)return false;let fresh=pool.filter(q=>!s.used.includes(q.id));if(!fresh.length){s.used=s.used.filter(id=>!pool.some(q=>q.id===id));fresh=pool;}let q=fresh[Math.floor(Math.random()*fresh.length)];s.used.push(q.id);s.quiz={question:q,purpose,done:false,result:null};s.phase='quiz';return true;},
 answer(s,input){let z=s.quiz;if(s.phase!=='quiz'||!z||z.done)return;let p=z.purpose.player!==undefined?s.players[z.purpose.player]:this.p(s);let value=this.number(input);let correct=Number.isFinite(value)&&Math.abs(value-Number(z.question.answer))<1e-8;z.done=true;z.result=correct;z.input=input;p.answered++;if(correct)p.correct++;s.history.push({player:p.name,id:z.question.id,prompt:z.question.prompt,input,answer:z.question.answer,correct});this.log(s,`${p.name} ${correct?'答啱':'答錯'}第 ${z.question.section} 節第 ${z.question.number} 題。`);return correct;},
 number(input){let t=String(input).normalize('NFKC').trim().replace(/[−–]/g,'-').replace(/^[a-z]\s*=\s*/i,'').replace(/\s/g,'');if(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))return Number(t);let f=t.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);return f&&Number(f[2])!==0?Number(f[1])/Number(f[2]):NaN;},
 quizContinue(s){let z=s.quiz;if(!z?.done)return;let p=z.purpose.player!==undefined?s.players[z.purpose.player]:this.p(s);s.quiz=null;s.phase='end';if(z.result){if(z.purpose.kind==='buy'){let t=BOARD[z.purpose.tile],cost=z.purpose.cost??t.price;if(p.cash>=cost&&!s.properties[t.id]){p.cash-=cost;s.properties[t.id]={owner:p.id,houses:0,mortgage:false};this.log(s,`${p.name} 以 $${cost} 買入${t.name}！`);}}else if(z.purpose.kind==='card'){if(!s.cards.length)s.cards=this.shuffle(CARDS.map((_,i)=>i));s.pending={kind:'cardReveal',card:s.cards.pop()};s.phase='card';}}else if(z.purpose.kind==='buy'&&!z.purpose.auction){this.auction(s,z.purpose.tile,[p.id]);}},
 shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;},
 applyCard(s){if(s.phase!=='card')return;let card=CARDS[s.pending.card],p=this.p(s);s.pending=null;s.phase='end';this.log(s,card.title+'：'+card.text);if(card.kind==='cash'){if(card.amount>0)p.cash+=card.amount;else this.charge(s,-card.amount);}if(card.kind==='free')p.free++;if(card.kind==='go'){p.pos=0;p.cash+=200;}if(card.kind==='jail')this.jail(s);if(card.kind==='back')this.move(s,-3);if(card.kind==='move')this.move(s,(card.to-p.pos+40)%40);if(card.kind==='repair'){let amount=Object.entries(s.properties).reduce((sum,[id,a])=>sum+(a.owner===p.id?(a.houses===5?100:(a.houses||0)*25):0),0);this.charge(s,amount);}},
 auction(s,id,excluded=[]){let eligible=s.players.filter(p=>!p.out&&p.cash>=10&&!excluded.includes(p.id)).map(p=>p.id);if(!eligible.length){s.phase='end';s.pending=null;return;}s.pending={kind:'auction',tile:id,eligible,turn:eligible[0],bid:0,winner:null};s.phase='auction';},
 bid(s,amount,pass=false){let a=s.pending;if(s.phase!=='auction')return false;if(pass)a.eligible=a.eligible.filter(id=>id!==a.turn);else{if(!Number.isInteger(amount)||amount<a.bid+10||amount>s.players[a.turn].cash)return false;a.bid=amount;a.winner=a.turn;}let contenders=a.eligible.filter(id=>id!==a.winner&&s.players[id].cash>=a.bid+10);if(!contenders.length){if(a.winner===null){s.phase='end';s.pending=null;}else s.phase='auctionQuiz';return true;}let next=contenders.find(id=>id>a.turn);a.turn=next??contenders[0];return true;},
 manage(s,id,action){let a=s.properties[id],t=BOARD[id],p=this.p(s);if(!a||a.owner!==p.id||!['roll','end','debt','jailPay','purchase'].includes(s.phase)||s.ended)return false;let group=BOARD.filter(b=>b.group===t.group),owned=group.map(b=>s.properties[b.id]);if(action==='mortgage'){if(a.mortgage|| (t.group&&owned.some(x=>x?.houses)))return false;a.mortgage=true;p.cash+=t.price/2;}else if(action==='redeem'){let cost=Math.ceil(t.price*.55);if(!a.mortgage||p.cash<cost)return false;p.cash-=cost;a.mortgage=false;}else if(action==='build'){let houses=Object.values(s.properties).reduce((sum,x)=>sum+(x.houses===5?0:x.houses),0),hotels=Object.values(s.properties).filter(x=>x.houses===5).length;if(t.type!=='land'||!this.ownGroup(s,p,t)||owned.some(x=>x.mortgage)||a.houses===5||p.cash<t.build||a.houses!==Math.min(...owned.map(x=>x.houses))|| (a.houses<4&&houses>=32)||(a.houses===4&&hotels>=12)||s.phase==='debt')return false;a.houses++;p.cash-=t.build;}else if(action==='sell'){let houses=Object.values(s.properties).reduce((sum,x)=>sum+(x.houses===5?0:x.houses),0);if(!a.houses||a.houses!==Math.max(...owned.map(x=>x?.houses||0))||(a.houses===5&&houses>28))return false;a.houses--;p.cash+=t.build/2;}else return false;this.log(s,`${p.name} ${ {mortgage:'抵押',redeem:'贖回',build:'加建',sell:'出售房屋：'}[action]}${t.name}。`);return true;}
};
if(typeof module!=='undefined')module.exports={Game,BOARD,CARDS};
</script><script>'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n).toLocaleString('en-HK',{maximumFractionDigits:1});
let bank=[...QUESTION_BANK],state=null,sound=false,busy=false,modalType='',lastFocus=null,toastTimer;
const KEY='yyc-monopoly-v1',BANK_KEY='yyc-bank-v1';
try{let custom=JSON.parse(localStorage.getItem(BANK_KEY));if(Array.isArray(custom)&&custom.length)bank=custom;let saved=JSON.parse(localStorage.getItem(KEY));if(saved?.version===1&&saved.players?.length===6)state=saved;}catch(e){}
function save(){try{if(state)localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='✓ 已自動儲存 · 本瀏覽器';}catch(e){$('#saveStatus').textContent='無法自動存檔，請到老師工具匯出進度';}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500);}
function beep(ok=true){if(!sound)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=ok?660:220;g.gain.setValueAtTime(.08,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.23);o.onended=()=>ctx.close();}catch(e){}}
function openModal(html,type,wide=false){lastFocus=document.activeElement;modalType=type;$('#modal').className='modal'+(wide?' wide':'');$('#modal').innerHTML=html;$('#overlay').hidden=false;setTimeout(()=>{$('#modal input:not([type=hidden])')?.focus()||$('#modal').focus();},30);}
function closeModal(){if(['quiz','setup','result'].includes(modalType))return;$('#overlay').hidden=true;modalType='';lastFocus?.focus();}
function forceClose(){$('#overlay').hidden=true;modalType='';}
const closeBtn='<button class="close" data-action="close" aria-label="關閉視窗">×</button>';
function setup(){openModal(`<div class="setup-header"><span class="big-token">🚋</span><p class="eyebrow">六位同學，一座城市。</p><h2 id="modalTitle">準備好出發未？</h2><p>寫低你哋嘅名字，帶住數學知識，一齊遊香港。</p></div><form id="setupForm"><div class="setup-grid">${TOKENS.map((x,i)=>`<div class="name-field"><span>${x}</span><div><label for="name${i}">玩家 ${i+1}</label><input id="name${i}" name="name${i}" maxlength="12" value="玩家 ${i+1}" required autocomplete="off"></div></div>`).join('')}</div><div class="settings-grid"><div class="field"><label for="rounds">遊戲長度</label><select id="rounds"><option value="6">6 回合 · 短課堂</option><option value="12" selected>12 回合 · 標準</option><option value="20">20 回合 · 進階</option><option value="999">不限回合</option></select></div><div class="field"><label for="chapter">題目範圍</label><select id="chapter"><option value="all">兩章混合</option><option value="2">第 2 章 · 有向數</option><option value="4">第 4 章 · 方程</option></select></div><div class="field"><label for="level">題目難度</label><select id="level"><option value="1">基礎運算</option><option value="2" selected>基礎＋進階</option><option value="3">全部（含應用題）</option></select></div></div><div class="setup-note"><span>每人 $1,500</span><span>六人輪流操作</span><span>隨機抽題，抽完先重複</span></div><div class="modal-actions"><button type="button" class="secondary" data-action="rules">先睇玩法</button><button type="submit" class="primary">開始香港之旅 →</button></div></form>`, 'setup',true);}
function pos(i){if(i<=10)return [11,11-i];if(i<=20)return[21-i,1];if(i<=30)return[1,i-19];return[i-29,11];}
const ICONS={go:'↖',chest:'✦',tax:'＄',station:'🚉',chance:'?',jail:'▥',utility:'⚡',parking:'P',gojail:'➜'};
function renderBoard(){document.querySelectorAll('.cell').forEach(x=>x.remove());BOARD.forEach(t=>{let a=state?.properties[t.id],p=state?Game.p(state):null,[row,col]=pos(t.id);let btn=document.createElement('button');btn.className='cell'+(t.id%10===0?' corner':'')+(p?.pos===t.id?' current':'')+(a?' owned':'')+(a?.mortgage?' mortgaged':'');btn.style.cssText=`grid-row:${row};grid-column:${col};--group:${GROUPS[t.group]?.[1]||'#b6c7ae'};--owner:${a?COLORS[a.owner]:''}`;btn.dataset.tile=t.id;btn.setAttribute('aria-label',`${t.name}${t.price?' 地價 '+money(t.price):''}${a?'，地主 '+state.players[a.owner].name:''}`);btn.innerHTML=`${t.group?'<span class="stripe"></span>':`<span class="special-icon">${t.name==='水務署'?'◉':ICONS[t.type]}</span>`}<span class="name">${t.name}</span>${t.price?`<span class="price">${money(t.price)}</span>`:t.type==='go'?'<span class="price">領取 $200</span>':''}${a?'<span class="owner-dot"></span>':''}${a?.houses?`<span class="buildings">${a.houses===5?'▣':'⌂'.repeat(a.houses)}</span>`:''}<span class="pawns">${(state?.players||[]).filter(p=>!p.out&&p.pos===t.id).map(p=>`<span class="pawn" style="--p:${COLORS[p.id]}" title="${esc(p.name)}">${p.id+1}</span>`).join('')}</span>`;$('#board').appendChild(btn);});}
function render(){renderBoard();$('#bankCount').textContent=`${bank.length} 道數學挑戰`;if(!state){$('#roundLabel').textContent='香港站 · 準備出發';$('#turnCard').innerHTML='<span class="turn-label">下一站，香港。</span><div class="turn-name">屬於你哋嘅旅程</div><p>六位探險家，帶住數學知識出發！</p><button class="primary" data-action="setup">開始新遊戲 →</button>';$('#players').innerHTML=TOKENS.map((t,i)=>playerHTML({id:i,name:`玩家 ${i+1}`,cash:1500,correct:0,answered:0})).join('');return;}let p=Game.p(state);$('#roundLabel').textContent=state.ended?'旅程完成 · 結算資產':`第 ${state.round}${state.settings.rounds===999?'':` / ${state.settings.rounds}`} 回合`;$('#players').innerHTML=state.players.map(playerHTML).join('');$('#log').innerHTML=state.logs.slice(0,15).map(x=>`<div class="log-entry">${esc(x)}</div>`).join('');renderTurn();save();}
function playerHTML(p){let n=state?Object.values(state.properties).filter(a=>a.owner===p.id).length:0;return `<div class="player ${state?.current===p.id?'active':''} ${p.out?'out':''}"><div class="player-icon" style="--p:${COLORS[p.id]}">${TOKENS[p.id]}</div><div class="player-info"><div class="player-name">${esc(p.name)}${state?.current===p.id&&!state.ended?'<em>當前</em>':''}</div><div class="player-sub">${p.out?'已破產':`${n} 塊地 · 答啱 ${p.correct} / ${p.answered}${p.jailed?' · 監獄':''}`}</div></div><div class="player-money">${money(p.cash)}</div></div>`;}
function renderTurn(){let p=Game.p(state),phase=state.phase,text='',buttons='',dice=`<div class="dice-row ${busy?'rolling':''}"><span class="die" aria-label="骰子一 ${state.dice[0]}">${['','⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[0]]}</span><span class="die" aria-label="骰子二 ${state.dice[1]}">${['','⚀','⚁','⚂','⚃','⚄','⚅'][state.dice[1]]}</span><span class="dice-sum">步數<strong>${state.dice[0]+state.dice[1]}</strong></span></div>`;
let button=(a,t)=>`<button class="primary" data-action="${a}" ${busy?'disabled':''}>${t}</button>`;
if(phase==='roll'){text=p.jailed?`你正在監獄（第 ${p.jail+1} 次嘗試）。擲出雙骰即可離開。`:'到你喇！擲骰，睇吓今次會去邊一站。';buttons=button('roll',p.jailed?'擲骰 · 嘗試出獄':'擲骰出發 ↗');if(p.jailed)buttons+=`<div class="turn-small"><button class="secondary" data-action="payJail" ${p.cash<50?'disabled':''}>付 $50 出獄</button>${p.free?'<button class="secondary" data-action="freeJail">使用出獄卡</button>':''}</div>`;}
if(phase==='purchase'){let t=BOARD[p.pos];text=`${t.name}尚未有地主。地價 ${money(t.price)}，答啱一題就可以買入。`;buttons=button('buy',p.cash>=t.price?'接受買地挑戰 →':'現金不足，參與拍賣 →')+`<div class="turn-small"><button class="secondary" data-action="auction">唔直接買 · 進入拍賣</button></div>`;}
if(phase==='draw'){text='抽到機會喇！先完成一道數學題，再揭曉你嘅卡牌。';buttons=button('draw','接受機會卡挑戰 →');}
if(phase==='end'){text=p.out?'你已破產。其餘玩家繼續旅程。':state.extra?'擲出雙骰！處理完地產後，可以再擲一次。':'呢一站完成！可以先管理地產，再交畀下一位同學。';buttons=button('next',state.extra?'雙骰獎勵 · 再擲一次 ↗':'完成回合 · 下一位 →');}
if(phase==='quiz'){text='請喺題目視窗完成今次挑戰。';buttons=button('resumeQuiz','繼續答題 →');}
if(phase==='card'){text='挑戰成功！你嘅機會卡已經準備好。';buttons=button('showCard','揭曉機會卡 →');}
if(phase==='debt'){text=`你需要支付 ${money(state.pending.amount)}，現金差 ${money(Math.max(0,state.pending.amount-p.cash))}。請抵押地產或出售房屋。`;buttons=button('debt',p.cash>=state.pending.amount?'支付欠款 →':'處理欠款 →');}
if(phase==='jailPay'){text='第三次未擲出雙骰，須先付 $50 離開監獄，再按今次點數前進。';buttons=button('jailPay',p.cash>=50?'支付 $50 並前進 →':'管理地產以支付 $50');if(p.free)buttons+='<div class="turn-small"><button class="secondary" data-action="freeJail">使用出獄卡</button></div>';}
if(phase==='auction'){let a=state.pending;text=`${BOARD[a.tile].name}拍賣中：輪到 ${state.players[a.turn].name} 出價。`;buttons=button('showAuction','開啟拍賣 →');}
if(phase==='auctionQuiz'){text='最高出價者需要答啱題目，先可以完成交易。';buttons=button('auctionQuiz','開始得標挑戰 →');}
if(phase==='finished'){text='旅程完成！按現金、地產及建築物總值決定名次。';buttons=button('result','查看成績榜 →');}
$('#turnCard').innerHTML=`<span class="turn-label">${state.ended?'旅程結算':'輪到你喇 · YOUR TURN'}</span><div class="turn-name"><span class="token-icon">${TOKENS[p.id]}</span>${esc(p.name)}</div>${dice}<p>${text}</p>${buttons}${!state.ended?'<div class="turn-small"><button class="secondary" data-action="assets">⌂ 管理地產</button><button class="secondary" data-action="trade">⇄ 地產交易</button></div>':''}`;}
function showQuiz(){let z=state.quiz;if(!z)return;let q=z.question,p=z.purpose.player!==undefined?state.players[z.purpose.player]:Game.p(state),isBuy=['buy','trade'].includes(z.purpose.kind),target=isBuy?BOARD[z.purpose.tile].name:'神秘機會卡';openModal(`<p class="eyebrow">${TOKENS[p.id]} ${esc(p.name)} · ${isBuy?'買地挑戰':'機會卡挑戰'}</p><h2 id="modalTitle">${z.done?(z.result?'答啱喇！':'差少少，下次再試。'):'用數學，打開下一站。'}</h2><span class="question-source">第 ${q.chapter} 章 · ${q.chapter===2?'有向數':'一元一次方程'} ｜ ${q.section} 節 · ${q.number}</span><div class="question-text ${q.prompt.length>70?'long':''}">${esc(q.prompt)}</div>${!z.done?`<form id="answerForm"><div class="answer-row"><input id="answer" aria-label="輸入答案" autocomplete="off" placeholder="輸入數值" maxlength="40" required><span>${esc(q.unit||'')}</span></div><p class="input-help">只需輸入數值，毋須單位。接受負數、小數及分數，例如 -3、0.5、1/2。</p><div class="modal-actions"><button type="button" class="secondary" data-action="giveup">唔識，睇解答</button><button type="submit" class="primary">提交答案 →</button></div></form>`:`<div class="result ${z.result?'':'wrong'}"><h3>${z.result?'✓ 正確':'正確答案：'+esc(q.answer)+' '+esc(q.unit||'')}</h3><div class="solution">${esc(q.solution)}</div></div><p>${z.result?(isBuy?`確認後以 ${money(z.purpose.cost??BOARD[z.purpose.tile].price)} 買入${esc(target)}。`:'確認後揭曉機會卡，並執行卡牌效果。'):(z.purpose.kind==='buy'&&!z.purpose.auction?'今次未能直接買入；其他玩家可參與拍賣。':'今次未能獲得'+esc(target)+'。')}</p><div class="modal-actions"><button class="primary" data-action="quizContinue">${z.result?'繼續 →':'記住方法，繼續 →'}</button></div>`}`, 'quiz');}
function showCard(){let c=CARDS[state.pending.card];openModal(`<p class="eyebrow">挑戰成功 · 機會卡</p><div style="font-size:50px;margin:22px 0">✦</div><h2 id="modalTitle">${c.title}</h2><p style="font-size:19px">${c.text}</p><div class="modal-actions"><button class="primary" data-action="applyCard">執行卡牌 →</button></div>`,'card');}
function showAuction(){let a=state.pending;if(state.phase==='auctionQuiz'){startAuctionQuiz();return;}let p=state.players[a.turn];openModal(`${closeBtn}<p class="eyebrow">城市拍賣場 · ${esc(BOARD[a.tile].name)}</p><h2 id="modalTitle">${TOKENS[p.id]} ${esc(p.name)} 出價</h2><p>目前最高價：<strong>${money(a.bid)}</strong>${a.winner!==null?'（'+esc(state.players[a.winner].name)+'）':''}<br>可用現金：${money(p.cash)}。每次最少加 $10。</p><form id="bidForm"><div class="field"><label for="bidInput">你嘅出價</label><input type="number" id="bidInput" min="${a.bid+10}" max="${p.cash}" step="1" value="${a.bid+10}" required></div><p class="input-help">得標後仍要答啱一道題目；答錯會流拍，地產保留喺銀行。</p><div class="modal-actions"><button class="secondary" type="button" data-action="passBid">放棄競投</button><button class="primary" type="submit">出價 →</button></div></form>`,'auction');}
function startAuctionQuiz(){let a=state.pending;if(Game.startQuiz(state,bank,{kind:'buy',tile:a.tile,cost:a.bid,player:a.winner,auction:true})){render();showQuiz();}else toast('題庫沒有符合設定嘅題目。');}
function property(id){let t=BOARD[id],a=state?.properties[id];if(!t.price){toast(`${t.name}：${{go:'經過或停留可領取 $200。',chest:'答啱數學題，先可以抽卡。',chance:'答啱數學題，先可以抽卡。',tax:'支付 '+money(t.amount),parking:'免費休息，冇獎金。',jail:'路過只屬探訪；被送入獄先受限制。',gojail:'立即前往監獄。'}[t.type]}`);return;}let rows=t.type==='land'?['基本租金','一間屋','兩間屋','三間屋','四間屋','一間酒店'].map((x,i)=>`<tr><td>${x}</td><td>${money(t.rents[i])}</td></tr>`).join(''):t.type==='station'?'<tr><td>擁有 1／2／3／4 個交通站</td><td>$25／50／100／200</td></tr>':'<tr><td>擁有 1／2 間公用事業</td><td>骰子總點數 × 4／10</td></tr>';openModal(`${closeBtn}<div class="property-header" style="--group:${GROUPS[t.group]?.[1]||'#578777'}"><p class="eyebrow">${GROUPS[t.group]?.[0]||'城市設施'}</p><h2 id="modalTitle">${t.name}</h2><p>地價 ${money(t.price)}</p></div><table class="rent-table">${rows}<tr><td>抵押可得</td><td>${money(t.price/2)}</td></tr>${t.build?`<tr><td>每次加建費</td><td>${money(t.build)}</td></tr>`:''}</table><div class="property-owner">${a?'地主：'+esc(state.players[a.owner].name)+(a.mortgage?' · 已抵押':' · 目前租金 '+money(Game.rent(state,t))):'銀行持有 · 等你嚟買'}</div>${t.group?'<p class="input-help">集齊同色地段，空地租金雙倍；同組須平均起屋。四間屋再加建成酒店。</p>':''}`,'property');}
function assets(){if(!state)return;let p=Game.p(state),items=BOARD.filter(t=>state.properties[t.id]?.owner===p.id);openModal(`${closeBtn}<p class="eyebrow">${TOKENS[p.id]} ${esc(p.name)} · 地產管理</p><h2 id="modalTitle">打造你嘅香港版圖</h2><p>現金 ${money(p.cash)} · 總資產 ${money(Game.worth(state,p))}</p><div class="property-list">${items.length?items.map(t=>{let a=state.properties[t.id];return `<div class="asset" style="--group:${GROUPS[t.group]?.[1]||'#729887'}"><div><strong>${t.name}</strong><small>${a.mortgage?'已抵押':a.houses===5?'酒店':a.houses+' 間屋'} · ${a.mortgage?'贖回 '+money(Math.ceil(t.price*.55)):'租金 '+money(Game.rent(state,t))}</small></div><div class="asset-actions">${t.type==='land'?`<button data-manage="build" data-id="${t.id}">加建 ${money(t.build)}</button><button data-manage="sell" data-id="${t.id}">賣屋</button>`:''}<button data-manage="${a.mortgage?'redeem':'mortgage'}" data-id="${t.id}">${a.mortgage?'贖回':'抵押 +'+money(t.price/2)}</button></div></div>`;}).join(''):'<div class="empty">未有地產，擲骰出發買第一塊地！</div>'}</div><p class="input-help">同組須平均興建／出售；同組有建築物就不能抵押。銀行共有 32 間屋及 12 間酒店。抵押後不收租，贖回須付抵押額加 10%。</p><div class="modal-actions"><button class="primary" data-action="close">返回棋盤</button></div>`,'assets',true);}
function debt(){let d=state.pending,p=Game.p(state);if(p.cash>=d.amount){Game.settleDebt(state);render();return;}openModal(`${closeBtn}<p class="eyebrow">先處理欠款</p><h2 id="modalTitle">仲欠 ${money(d.amount-p.cash)}</h2><p>應付 ${money(d.amount)}；現金 ${money(p.cash)}。可以出售房屋或抵押地產。如果無法清償，可宣告破產。</p><div class="modal-actions"><button class="danger" data-action="bankruptConfirm">宣告破產</button><button class="primary" data-action="assets">管理地產 →</button></div>`,'debt');}
function trade(){if(!state||!['roll','end'].includes(state.phase)){toast('請喺擲骰前或完成格子效果後交易。');return;}let p=Game.p(state),lands=BOARD.filter(t=>state.properties[t.id]?.owner===p.id&&!state.properties[t.id].mortgage&&(!t.group||!BOARD.filter(b=>b.group===t.group).some(b=>state.properties[b.id]?.houses)));if(!lands.length){toast('未有可交易嘅地產；須先售出同組房屋及贖回抵押。');return;}openModal(`${closeBtn}<p class="eyebrow">雙方同意，先可以交易</p><h2 id="modalTitle">出售一塊地產</h2><p>由 ${esc(p.name)} 提出交易，買方確認後再答題完成過戶。</p><form id="tradeForm"><div class="field"><label for="tradeTile">出售地產</label><select id="tradeTile">${lands.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label for="tradeBuyer">買方</label><select id="tradeBuyer">${state.players.filter(x=>!x.out&&x.id!==p.id).map(x=>`<option value="${x.id}">${esc(x.name)}（${money(x.cash)}）</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label for="tradePrice">售價（整數）</label><input type="number" id="tradePrice" min="1" step="1" value="100" required></div><div class="modal-actions"><button class="primary" type="submit">交畀買方確認 →</button></div></form>`,'trade');}
let tradeOffer=null;
function rules(){let returnSetup=!state;openModal(`${closeBtn}<p class="eyebrow">HOW TO PLAY</p><h2 id="modalTitle">一座香港，六位大庫翁。</h2><ol class="rules-list"><li>每人獲發 <strong>$1,500</strong>，由起點出發，輪流擲兩粒骰，順時針移動。每經過起點領 $200。</li><li><strong>買地先計數：</strong>到達未售地產，可接受隨機題目。答啱先扣錢買入；答錯不扣錢，由其他玩家拍賣。主動不買亦會進入拍賣。得標者同樣要答題，答錯則流拍。</li><li><strong>抽卡先計數：</strong>機會及社區基金格都先答題。答啱先抽卡並執行；答錯冇卡牌效果。</li><li>到達其他玩家地產，支付租金。集齊同色地產，空地租金加倍，可平均起屋；四間屋可升級成酒店。交通站及公用事業另計租金。</li><li>雙骰可再擲；連續三次雙骰會入獄。入獄後可以付 $50、用出獄卡，或嘗試擲雙骰；第三次失敗須付 $50。</li><li>現金不足可售屋（半價）或抵押地產（地價一半）。抵押地產不收租，贖回多付 10%。無法清償可破產。</li><li>六人各完成一次行動為一回合，雙骰獎勵屬同一回合。達到設定回合上限，按<strong>現金＋地產原價＋建築成本</strong>結算；抵押地產只計半價。資產相同並列，破產者排末。</li></ol><div class="notice">課堂規則：不限答題時間，可用紙筆。交易採用單塊地產現金買賣；銀行無法成交嘅拍賣保留地產。破產時建築物按半價折現予債權人，抵押地產轉移免即時利息。老師可隨時結算。</div><div class="modal-actions"><button class="primary" data-action="${returnSetup?'setup':'close'}">明白，出發！</button></div>`,'rules',true);}
function download(name,data,type='application/json'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function teacher(){openModal(`${closeBtn}<p class="eyebrow">老師工具 · 共用電腦模式</p><h2 id="modalTitle">課堂由你話事。</h2><p>已收錄 ${bank.length} 題：第 2 章 ${bank.filter(q=>q.chapter===2).length} 題、第 4 章 ${bank.filter(q=>q.chapter===4).length} 題。每題保留原檔、章節及題號。未採用無法完整讀取嘅嵌入公式、圖像題及開放題。</p><div class="notice">此工具會顯示答案，適合由老師操作；共用電腦版本沒有登入或密碼保護。</div><div class="teacher-buttons"><button class="secondary" data-action="exportBank">匯出題庫 JSON</button><button class="secondary" data-action="importBank">匯入題庫 JSON</button><button class="secondary" data-action="addQuestion">加入題目</button>${state?'<button class="secondary" data-action="exportGame">匯出遊戲進度</button><button class="secondary" data-action="exportResults">匯出答題紀錄</button>':''}<button class="secondary" data-action="importGame">載入遊戲進度</button>${state&&!state.ended?'<button class="danger" data-action="finishConfirm">提早結算</button>':''}</div><h3>題庫預覽 <span class="muted">點選題目睇答案</span></h3><div class="field"><input id="bankSearch" aria-label="搜尋題庫" placeholder="搜尋題目、章節或題號"></div><div class="bank-list" id="bankList"></div><input id="fileInput" type="file" accept=".json,application/json" hidden>`, 'teacher',true);renderBank('');}
function renderBank(term){$('#bankList').innerHTML=bank.filter(q=>(q.prompt+q.section+q.id).includes(term)).slice(0,60).map(q=>`<details class="bank-item"><summary><strong>${q.section} · ${q.number}</strong>　${esc(q.prompt)}</summary><p>答案：${esc(q.answer)} ${esc(q.unit||'')}<br>${esc(q.source)} · 答案：${esc(q.solutionSource||'老師提供')}</p><div class="solution">${esc(q.solution)}</div></details>`).join('')||'<p>沒有符合嘅題目。</p>';}
function addQuestion(){openModal(`${closeBtn}<p class="eyebrow">擴充題庫</p><h2 id="modalTitle">加入你嘅數學題</h2><p>目前自動批改支援單一數值答案。</p><form id="questionForm"><div class="field"><label for="qPrompt">題目</label><textarea id="qPrompt" rows="3" maxlength="1200" required></textarea></div><div class="settings-grid"><div class="field"><label for="qAnswer">數值答案</label><input id="qAnswer" required placeholder="例如 -3 或 1/2"></div><div class="field"><label for="qUnit">單位（可留空）</label><input id="qUnit" maxlength="10"></div><div class="field"><label for="qChapter">章節</label><select id="qChapter"><option value="2">第 2 章</option><option value="4">第 4 章</option></select></div></div><div class="field" style="margin-top:12px"><label for="qSolution">解題步驟</label><textarea id="qSolution" rows="3" maxlength="3000" required></textarea></div><div class="modal-actions"><button class="primary" type="submit">加入題庫</button></div></form>`,'add');}
function results(){if(!state)return;let list=[...state.players].sort((a,b)=>(a.out-b.out)||Game.worth(state,b)-Game.worth(state,a)),top=Game.worth(state,list[0]),winners=list.filter(p=>!p.out&&Game.worth(state,p)===top);openModal(`<p class="eyebrow">HONG KONG ADVENTURE · 完成！</p><div class="winner-icon">🏆</div><h2 id="modalTitle">${winners.map(p=>esc(p.name)).join('、')}，恭喜晒！</h2><p>計過每一步，贏得你嘅香港故事。</p><table class="score-table"><thead><tr><th>名次／玩家</th><th>現金</th><th>總資產</th><th>答啱／作答</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${p.out?'—':list.findIndex(x=>!x.out&&Game.worth(state,x)===Game.worth(state,p))+1}　${TOKENS[p.id]} ${esc(p.name)}${p.out?'（破產）':''}</td><td>${money(p.cash)}</td><td>${money(Game.worth(state,p))}</td><td>${p.correct}／${p.answered}</td></tr>`).join('')}</tbody></table><div class="modal-actions"><button class="secondary" data-action="exportResults">匯出答題紀錄</button><button class="secondary" data-action="hideResults">返回棋盤</button><button class="primary" data-action="newConfirm">再玩一局 →</button></div>`,'result',true);}
function confirmModal(title,text,action){openModal(`${closeBtn}<h2 id="modalTitle">${title}</h2><p>${text}</p><div class="modal-actions"><button class="secondary" data-action="close">取消</button><button class="danger" data-action="${action}">確認</button></div>`,'confirm');}
function syncPhase(){render();if(state.phase==='quiz')showQuiz();else if(state.phase==='card')showCard();else if(state.phase==='auction')showAuction();else if(state.phase==='auctionQuiz')startAuctionQuiz();else if(state.ended)results();}
async function action(a){if(busy&&a!=='close')return;let p=state&&Game.p(state);switch(a){case'close':closeModal();break;case'setup':setup();break;case'rules':rules();break;case'teacher':teacher();break;case'roll':if(state.phase!=='roll')return;busy=true;renderTurn();await new Promise(r=>setTimeout(r,480));let ds=new Uint32Array(2);crypto.getRandomValues(ds);const fair=()=>{let a=new Uint32Array(1);do{crypto.getRandomValues(a);}while(a[0]>=4294967292);return a[0]%6+1;};Game.roll(state,fair(),fair());busy=false;beep();syncPhase();break;case'next':Game.next(state);syncPhase();break;case'buy':if(state.phase!=='purchase')return;if(p.cash<BOARD[p.pos].price){Game.auction(state,p.pos);syncPhase();break;}if(Game.startQuiz(state,bank,{kind:'buy',tile:p.pos})){render();showQuiz();}else toast('沒有符合設定嘅題目。');break;case'auction':if(state.phase!=='purchase')return;Game.auction(state,p.pos);syncPhase();break;case'draw':if(state.phase==='draw'&&Game.startQuiz(state,bank,{kind:'card'})){render();showQuiz();}break;case'resumeQuiz':showQuiz();break;case'giveup':Game.answer(state,'未作答');beep(false);render();showQuiz();break;case'quizContinue':if(state.quiz?.purpose.kind==='trade'){completeTradeQuiz();break;}Game.quizContinue(state);forceClose();syncPhase();break;case'showCard':showCard();break;case'applyCard':Game.applyCard(state);forceClose();syncPhase();break;case'assets':assets();break;case'trade':trade();break;case'debt':debt();break;case'bankruptConfirm':confirmModal('確認宣告破產？','你會退出本局，資產按欠款對象轉交債權人或銀行。','bankrupt');break;case'bankrupt':Game.bankrupt(state);forceClose();syncPhase();break;case'payJail':Game.release(state);render();break;case'freeJail':Game.release(state,true);syncPhase();break;case'jailPay':if(p.cash>=50){Game.release(state);syncPhase();}else{state.phase='debt';state.pending={kind:'debt',amount:50,to:null,jailSteps:state.dice[0]+state.dice[1]};debt();save();}break;case'showAuction':showAuction();break;case'passBid':Game.bid(state,0,true);forceClose();syncPhase();break;case'auctionQuiz':startAuctionQuiz();break;case'result':results();break;case'hideResults':forceClose();break;case'newConfirm':confirmModal('重新開始一局？','目前進度會被取代。可以先去老師工具匯出進度。','new');break;case'new':state=null;try{localStorage.removeItem(KEY);}catch(e){}forceClose();render();setup();break;case'finishConfirm':confirmModal('而家結算遊戲？','會按目前資產決定名次，並結束本局。','finish');break;case'finish':Game.finish(state);syncPhase();break;case'exportBank':download('YYC-題庫.json',JSON.stringify(bank,null,2));break;case'exportGame':download('YYC-遊戲進度.json',JSON.stringify({state,bank},null,2));break;case'exportResults':download('YYC-答題紀錄.json',JSON.stringify({players:state.players.map(p=>({name:p.name,cash:p.cash,assets:Game.worth(state,p),correct:p.correct,answered:p.answered,bankrupt:p.out})),answers:state.history},null,2));break;case'importBank':fileImport('bank');break;case'importGame':fileImport('game');break;case'addQuestion':addQuestion();break;case'acceptTrade':if(!tradeOffer)return;let offer=tradeOffer;if(Game.startQuiz(state,bank,{kind:'trade',...offer})){render();showQuiz();}break;}}
function completeTradeQuiz(){let z=state.quiz;if(!z?.done)return;let o=z.purpose,buyer=state.players[o.player],seller=state.players[o.seller];if(z.result&&buyer.cash>=o.cost&&state.properties[o.tile]?.owner===o.seller){buyer.cash-=o.cost;seller.cash+=o.cost;state.properties[o.tile].owner=buyer.id;Game.log(state,`${buyer.name} 以 ${money(o.cost)} 向 ${seller.name} 買入${BOARD[o.tile].name}。`);}state.phase=o.returnPhase;state.quiz=null;tradeOffer=null;forceClose();render();}
function validateBank(data){if(!Array.isArray(data)||!data.length||data.length>5000)throw Error('題庫須為 1 至 5000 道題目嘅 JSON 陣列。');const ids=new Set();return data.map(q=>{if(typeof q.id!=='string'||ids.has(q.id)||typeof q.prompt!=='string'||!q.prompt.trim()||!Number.isFinite(Game.number(q.answer))||![2,4].includes(q.chapter)||![1,2,3].includes(q.level))throw Error('題目格式有誤、ID 重複或答案唔係數值。');ids.add(q.id);return {id:q.id.slice(0,100),prompt:q.prompt.slice(0,1500),answer:String(Game.number(q.answer)),chapter:q.chapter,level:q.level,section:String(q.section||q.chapter),number:String(q.number||'自訂'),unit:String(q.unit||'').slice(0,20),solution:String(q.solution||q.answer).slice(0,5000),source:String(q.source||'老師提供'),solutionSource:String(q.solutionSource||'老師提供')};});}
function fileImport(kind){let input=$('#fileInput');input.onchange=async()=>{try{let f=input.files[0];if(!f)return;if(f.size>10000000)throw Error('檔案太大，請使用 10 MB 以下嘅 JSON。');let d=JSON.parse(await f.text());if(kind==='bank'){let validated=validateBank(d);if(state&&!validated.some(q=>(state.settings.chapter==='all'||q.chapter===Number(state.settings.chapter))&&q.level<=state.settings.level))throw Error('新題庫沒有符合本局章節／難度嘅題目。');bank=validated;if(state)state.used=[];}else{if(!d.state||d.state.version!==1||!Array.isArray(d.state.players)||d.state.players.length!==6)throw Error('遊戲進度格式不正確。');let phases=['roll','end','purchase','draw','quiz','card','auction','auctionQuiz','debt','jailPay','finished'];if(!phases.includes(d.state.phase)||!Number.isInteger(d.state.current)||d.state.current<0||d.state.current>5||!d.state.players.every((p,i)=>p.id===i&&typeof p.name==='string'&&Number.isFinite(p.cash)&&p.cash>=0&&Number.isInteger(p.pos)&&p.pos>=0&&p.pos<40))throw Error('遊戲資料不完整。');bank=validateBank(d.bank);state=d.state;}try{localStorage.setItem(BANK_KEY,JSON.stringify(bank));}catch(e){toast('題庫已載入，但瀏覽器未能永久儲存。');}forceClose();syncPhase();toast('已成功載入。');}catch(e){toast('未能載入：'+e.message);}input.value='';};input.click();}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b.dataset.action);return;}let t=e.target.closest('[data-tile]');if(t)property(Number(t.dataset.tile));let m=e.target.closest('[data-manage]');if(m){if(Game.manage(state,Number(m.dataset.id),m.dataset.manage)){render();assets();}else toast('未符合條件：檢查現金、同色地段、平均建築數及銀行庫存。');}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='setupForm'){let names=TOKENS.map((_,i)=>$('#name'+i).value.trim()||'玩家 '+(i+1));let settings={rounds:Number($('#rounds').value),chapter:$('#chapter').value,level:Number($('#level').value)};if(!bank.some(q=>(settings.chapter==='all'||q.chapter===Number(settings.chapter))&&q.level<=settings.level)){toast('題庫冇符合設定嘅題目，請調整難度或題目範圍。');return;}state=Game.create(names,settings);forceClose();render();}if(e.target.id==='answerForm'){let value=$('#answer').value;if(!Number.isFinite(Game.number(value))){toast('請輸入數值，例如 -3、0.5 或 1/2。');return;}let ok=Game.answer(state,value);beep(ok);render();showQuiz();}if(e.target.id==='bidForm'){if(Game.bid(state,Number($('#bidInput').value))){forceClose();syncPhase();}else toast('出價須至少高 $10，而且唔可以超過現金。');}if(e.target.id==='tradeForm'){let player=Number($('#tradeBuyer').value),cost=Number($('#tradePrice').value),tile=Number($('#tradeTile').value);if(cost>state.players[player].cash){toast('買方現金不足。');return;}tradeOffer={player,cost,tile,seller:state.current,returnPhase:state.phase};openModal(`${closeBtn}<p class="eyebrow">請交畀 ${esc(state.players[player].name)} 確認</p><h2 id="modalTitle">以 ${money(cost)} 買入${BOARD[tile].name}？</h2><p>賣方：${esc(Game.p(state).name)}。你要完成一道題目先會扣錢同過戶。</p><div class="modal-actions"><button class="secondary" data-action="close">拒絕</button><button class="primary" data-action="acceptTrade">同意，開始答題</button></div>`,'tradeConfirm');}if(e.target.id==='questionForm'){let answer=Game.number($('#qAnswer').value);if(!Number.isFinite(answer)){toast('答案須為單一數值。');return;}let ch=Number($('#qChapter').value);bank.push({id:'custom-'+Date.now(),chapter:ch,section:ch+'.自訂',number:'老師自訂',prompt:$('#qPrompt').value.trim(),answer:String(answer),unit:$('#qUnit').value.trim(),solution:$('#qSolution').value.trim(),level:2,source:'老師提供',solutionSource:'老師提供'});try{localStorage.setItem(BANK_KEY,JSON.stringify(bank));}catch(e){toast('新增成功；請匯出題庫以保留。');}render();teacher();toast('題目已加入。');}});
document.addEventListener('input',e=>{if(e.target.id==='bankSearch')renderBank(e.target.value);});
document.addEventListener('keydown',e=>{if($('#overlay').hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){let focus=[...$('#modal').querySelectorAll('button:not(:disabled),input:not([hidden]),select,textarea,summary')].filter(x=>x.offsetParent!==null);if(!focus.length){e.preventDefault();return;}let first=focus[0],last=focus.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal'))){last.focus();e.preventDefault();}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}}});
$('#rulesBtn').onclick=rules;$('#teacherBtn').onclick=teacher;$('#newBtn').onclick=()=>action('newConfirm');$('#soundBtn').onclick=()=>{sound=!sound;$('#soundBtn').style.background=sound?'#d8e8d0':'';$('#soundBtn').setAttribute('aria-label',sound?'關閉音效':'開啟音效');toast(sound?'音效已開啟':'音效已關閉');beep();};$('#fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(e){toast('此瀏覽器未支援全螢幕，請使用瀏覽器全螢幕功能。');}};
render();if(!state)setup();else{toast('歡迎返嚟，已恢復上次遊戲。');if(state.phase==='quiz')showQuiz();else if(state.ended)results();}
</script></body></html>
